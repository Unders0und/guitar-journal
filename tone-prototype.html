<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tone Patch Editor — Prototype</title>
<meta name="version" content="2025-04-05-001">
<style>
  :root {
    --bg: #0d0d0d;
    --card: #161616;
    --card2: #1c1c1c;
    --border: #2a2a2a;
    --border2: #333;
    --accent: #7c5cbf;
    --muted: #555;
    --muted2: #888;
    --text: #e8e8e8;
    --text2: #bbb;
    --c-dynamics: #4a9eff;
    --c-filter:   #ff9f43;
    --c-drive:    #ff6b6b;
    --c-amp:      #ffd93d;
    --c-cabinet:  #c8a96e;
    --c-mod:      #a8e6cf;
    --c-sfx:      #ff8dce;
    --c-delay:    #74b9ff;
    --c-reverb:   #81ecec;
    --c-pedal:    #b2bec3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Pro Display', -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 1rem;
    max-width: 600px;
    margin: 0 auto;
  }

  /* ── MIDI bar ── */
  .midi-bar {
    display: flex; align-items: center; gap: 8px;
    padding: .5rem .7rem; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    margin-bottom: .85rem;
  }
  .midi-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
    transition: background .3s, box-shadow .3s;
  }
  .midi-dot.connected { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
  .midi-dot.searching { background: #f39c12; animation: mpulse 1s ease-in-out infinite; }
  .midi-dot.error     { background: #e74c3c; }
  @keyframes mpulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .midi-status { font-size: .7rem; color: var(--muted2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .midi-connect-btn {
    font-size: .65rem; padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--border2); background: none;
    color: var(--text2); cursor: pointer; font-family: inherit;
    white-space: nowrap; flex-shrink: 0;
  }
  .midi-connect-btn:hover { border-color: var(--accent); color: var(--text); }
  .midi-connect-btn.connected { border-color: #2ecc7155; color: #2ecc71; }

  /* bank/prog row */
  .midi-bp-row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: .85rem;
  }
  .midi-bp-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
  .midi-bank-btn, .midi-prog-btn {
    padding: 3px 8px; border-radius: 5px; font-size: .72rem; font-weight: 700;
    border: 1px solid var(--border); background: var(--card2);
    color: var(--muted2); cursor: pointer; font-family: inherit;
    transition: background .12s, color .12s, border-color .12s;
  }
  .midi-bank-btn.active, .midi-prog-btn.active {
    background: rgba(124,92,191,.2); border-color: var(--accent); color: var(--text);
  }
  .midi-sep { color: var(--muted); font-size: .8rem; }
  .midi-editor-btn {
    margin-left: auto; font-size: .62rem; padding: 3px 9px;
    border-radius: 5px; border: 1px solid var(--border);
    background: none; color: var(--muted); cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .midi-editor-btn.active {
    border-color: #2ecc7155; color: #2ecc71;
    background: rgba(46,204,113,.08);
  }

  .slot-column.midi-flash .effect-slot {
    border-color: #2ecc71 !important;
    box-shadow: 0 0 8px rgba(46,204,113,.5);
    transition: border-color .05s, box-shadow .05s;
  }

  /* ── Patch header ── */
  .patch-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: .9rem;
  }
  .patch-slot {
    background: var(--card2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: .7rem;
    color: var(--muted2);
    white-space: nowrap;
  }
  .patch-name-input {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border2);
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 600;
    padding: 2px 0;
    outline: none;
  }
  .patch-name-input:focus { border-bottom-color: var(--accent); }
  .patch-level-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: .68rem;
    color: var(--muted2);
    white-space: nowrap;
  }
  .patch-level-wrap input[type=range] { width: 60px; accent-color: var(--accent); }

  /* ── Guitar section ── */
  .guitar-section {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: .85rem;
  }
  .guitar-info {
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-width: 0;
  }
  .guitar-info-top {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .guitar-emoji { font-size: 1.25rem; line-height: 1; flex-shrink: 0; }
  .guitar-name-input {
    background: none;
    border: none;
    border-bottom: 1px solid var(--border2);
    color: var(--text);
    font-size: .82rem;
    padding: 2px 0;
    outline: none;
    font-family: inherit;
    width: 120px;
  }
  .guitar-name-input:focus { border-bottom-color: var(--accent); }
  .guitar-pickup-select {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text2);
    font-size: .7rem;
    padding: 3px 6px;
    outline: none;
    font-family: inherit;
  }
  .guitar-pickup-select:focus { border-color: var(--accent); }
  .guitar-knobs {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    margin-left: auto;
  }

  /* ── Slots row ── */
  .slots-row {
    display: flex;
    gap: 5px;
    margin-bottom: .85rem;
    align-items: flex-end;
  }

  /* each slot = the card + stomp button as a column */
  .slot-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: grab;
  }
  .slot-column.dragging { opacity: .35; cursor: grabbing; }
  .slot-column.drag-over .effect-slot { border-top: 2px solid var(--accent); }

  .effect-slot {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 7px 3px 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    user-select: none;
    min-height: 96px;
    gap: 4px;
  }
  .effect-slot:hover { background: var(--card2); border-color: var(--border2); }
  .effect-slot.active { border-color: var(--accent) !important; box-shadow: 0 0 0 1px #7c5cbf33; }
  .effect-slot.empty { border-style: dashed; border-color: #252525; }
  .effect-slot.empty:hover { border-color: #3a3a3a; }

  .slot-num {
    font-size: .52rem;
    color: var(--muted);
    align-self: flex-start;
    padding-left: 3px;
    line-height: 1;
    flex-shrink: 0;
  }
  .slot-cat {
    font-size: .48rem;
    text-transform: uppercase;
    letter-spacing: .07em;
    font-weight: 700;
    text-align: center;
    line-height: 1;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .slot-name {
    font-size: .59rem;
    color: var(--text2);
    text-align: center;
    line-height: 1.25;
    word-break: break-word;
    padding: 0 2px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slot-empty-icon {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: #2d2d2d;
  }

  /* ── Stomp button ── */
  .stomp-btn {
    width: 100%;
    height: 22px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    position: relative;
    transition: background .15s, box-shadow .15s;
    flex-shrink: 0;
    outline: none;
  }
  .stomp-btn.on {
    background: #1a0505;
    box-shadow:
      0 0 6px #ff3b3b88,
      0 0 12px #ff3b3b33,
      inset 0 1px 0 rgba(255,255,255,.06),
      inset 0 -1px 0 rgba(0,0,0,.5);
    border: 1px solid #ff3b3b55;
  }
  .stomp-btn.on::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ff4444;
    box-shadow: 0 0 6px #ff4444, 0 0 10px #ff444466;
  }
  .stomp-btn.off {
    background: #141414;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.04),
      inset 0 -1px 0 rgba(0,0,0,.4);
    border: 1px solid #2a2a2a;
  }
  .stomp-btn.off::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #2a2a2a;
    box-shadow: none;
  }
  /* active press */
  .stomp-btn:active {
    transform: scaleY(.92);
  }

  /* category colors */
  .cat-DYNAMICS { color: var(--c-dynamics); }
  .cat-FILTER   { color: var(--c-filter); }
  .cat-DRIVE    { color: var(--c-drive); }
  .cat-AMP      { color: var(--c-amp); }
  .cat-CABINET  { color: var(--c-cabinet); }
  .cat-MOD      { color: var(--c-mod); }
  .cat-SFX      { color: var(--c-sfx); }
  .cat-DELAY    { color: var(--c-delay); }
  .cat-REVERB   { color: var(--c-reverb); }
  .cat-PEDAL    { color: var(--c-pedal); }

  .bg-DYNAMICS { background: #4a9eff14 !important; border-color: #4a9eff30 !important; }
  .bg-FILTER   { background: #ff9f4314 !important; border-color: #ff9f4330 !important; }
  .bg-DRIVE    { background: #ff6b6b14 !important; border-color: #ff6b6b30 !important; }
  .bg-AMP      { background: #ffd93d14 !important; border-color: #ffd93d30 !important; }
  .bg-CABINET  { background: #c8a96e14 !important; border-color: #c8a96e30 !important; }
  .bg-MOD      { background: #a8e6cf14 !important; border-color: #a8e6cf30 !important; }
  .bg-SFX      { background: #ff8dce14 !important; border-color: #ff8dce30 !important; }
  .bg-DELAY    { background: #74b9ff14 !important; border-color: #74b9ff30 !important; }
  .bg-REVERB   { background: #81ecec14 !important; border-color: #81ecec30 !important; }
  .bg-PEDAL    { background: #b2bec314 !important; border-color: #b2bec330 !important; }

  .arc-DYNAMICS { stroke: var(--c-dynamics); }
  .arc-FILTER   { stroke: var(--c-filter); }
  .arc-DRIVE    { stroke: var(--c-drive); }
  .arc-AMP      { stroke: var(--c-amp); }
  .arc-CABINET  { stroke: var(--c-cabinet); }
  .arc-MOD      { stroke: var(--c-mod); }
  .arc-SFX      { stroke: var(--c-sfx); }
  .arc-DELAY    { stroke: var(--c-delay); }
  .arc-REVERB   { stroke: var(--c-reverb); }
  .arc-PEDAL    { stroke: var(--c-pedal); }
  .arc-GUITAR   { stroke: #777; }

  /* ── Effect editor ── */
  .effect-editor {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .8rem .9rem;
    margin-bottom: .85rem;
    display: none;
  }
  .effect-editor.open { display: block; }
  .editor-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: .7rem;
  }
  .editor-cat-select, .editor-effect-select {
    background: var(--card2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    color: var(--text);
    font-size: .75rem;
    padding: 4px 8px;
    outline: none;
    font-family: inherit;
  }
  .editor-cat-select:focus, .editor-effect-select:focus { border-color: var(--accent); }
  .editor-effect-select { flex: 1; }

  .knobs-grid { display: flex; flex-wrap: wrap; gap: 10px 6px; }

  .param-alt-page {
    background: rgba(255,255,255,.03);
    border-radius: 7px;
    outline: 1px solid rgba(255,255,255,.055);
    outline-offset: 2px;
  }

  /* ── Patch description ── */
  .patch-desc {
    width: 100%; background: var(--card2);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text2); font-size: .78rem; padding: .45rem .6rem;
    resize: none; outline: none; font-family: inherit; line-height: 1.5;
    margin-bottom: .85rem;
  }
  .patch-desc:focus { border-color: var(--accent); color: var(--text); }
  .patch-desc::placeholder { color: var(--muted); }

  /* ── Toggle switch ── */
  .switch-wrap {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; width: 56px;
  }
  .switch-label {
    font-size: .55rem; color: var(--muted2);
    text-transform: uppercase; letter-spacing: .06em;
    text-align: center; line-height: 1.2; min-height: 1.5em;
  }
  .switch-track {
    position: relative; width: 38px; height: 20px;
    background: #1e1e1e; border: 1px solid #333;
    border-radius: 10px; cursor: pointer;
    transition: background .2s, border-color .2s;
    flex-shrink: 0;
  }
  .switch-track.on {
    background: #1a1a2e;
    border-color: var(--accent);
    box-shadow: 0 0 6px rgba(124,92,191,.35);
  }
  .switch-thumb {
    position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #444;
    box-shadow: 0 1px 3px rgba(0,0,0,.6);
    transition: left .2s, background .2s;
  }
  .switch-track.on .switch-thumb {
    left: 20px;
    background: var(--accent);
    box-shadow: 0 0 5px rgba(124,92,191,.7);
  }
  .switch-value {
    font-size: .62rem; color: var(--text2);
    text-align: center; min-width: 22px;
  }

  /* ── Multi-option pill selector ── */
  .pill-wrap {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; min-width: 56px; max-width: 90px;
  }
  .pill-label {
    font-size: .55rem; color: var(--muted2);
    text-transform: uppercase; letter-spacing: .06em;
    text-align: center; line-height: 1.2; min-height: 1.5em;
  }
  .pill-options {
    display: flex; flex-direction: column; gap: 2px; width: 100%;
  }
  .pill-opt {
    font-size: .6rem; padding: 2px 6px; border-radius: 4px;
    border: 1px solid #2a2a2a; background: none;
    color: var(--muted2); cursor: pointer; font-family: inherit;
    text-align: center; transition: background .12s, color .12s, border-color .12s;
    white-space: nowrap;
  }
  .pill-opt.active {
    background: rgba(124,92,191,.18);
    border-color: var(--accent);
    color: var(--text);
  }

  /* ── Knob ── */
  .knob-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 56px; }
  .knob-label { font-size: .55rem; color: var(--muted2); text-transform: uppercase; letter-spacing: .06em; text-align: center; line-height: 1.2; min-height: 1.5em; }
  .knob-value { font-size: .62rem; color: var(--text2); font-variant-numeric: tabular-nums; text-align: center; min-width: 22px; }
  .knob { width: 44px; height: 44px; border-radius: 50%; position: relative; cursor: ns-resize; touch-action: none; flex-shrink: 0; }
  .knob-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .knob-body {
    position: absolute; inset: 6px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4a4a4a 0%, #282828 45%, #0e0e0e 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,.9), inset 0 1px 2px rgba(255,255,255,.09), inset 0 -1px 3px rgba(0,0,0,.7);
    border: 1px solid #1e1e1e;
  }
  .knob-indicator { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; box-shadow: 0 0 3px rgba(255,255,255,.8); }
</style>
</head>
<body>

<!-- MIDI Bar -->
<div class="midi-bar">
  <div class="midi-dot" id="midiDot"></div>
  <div class="midi-status" id="midiStatus">Not connected</div>
  <span style="font-size:.55rem;color:var(--muted);flex-shrink:0;">v2025.04.05-10</span>
  <button class="midi-connect-btn" id="midiConnectBtn" onclick="connectMIDI()">Connect</button>
</div>

<!-- Bank / Program selector -->
<div class="midi-bp-row" id="midiBpRow" style="display:none;">
  <span class="midi-bp-label">Bank</span>
  <div id="midiBankBtns" style="display:flex;gap:4px;"></div>
  <span class="midi-sep">·</span>
  <span class="midi-bp-label">Patch</span>
  <div id="midiProgBtns" style="display:flex;gap:3px;"></div>
  <button class="midi-editor-btn" id="midiEditorBtn" onclick="toggleEditorMode()">Edit</button>
</div>

<!-- Patch header -->
<div class="patch-header">
  <div class="patch-slot" id="patchSlotLabel">A-0</div>
  <input class="patch-name-input" id="patchName" value="Crunch Lead" maxlength="10" />
  <div class="patch-level-wrap">
    LVL <input type="range" min="0" max="100" value="80" id="patchLevel" />
    <span id="patchLevelVal">80</span>
  </div>
</div>
<textarea class="patch-desc" id="patchDesc" rows="2" placeholder="Describe this tone — context, songs, amp settings…"></textarea>

<!-- Guitar section -->
<div class="guitar-section">
  <div class="guitar-info">
    <div class="guitar-info-top">
      <span class="guitar-emoji">🎸</span>
      <input class="guitar-name-input" placeholder="Guitar name…" value="Fender Strat" />
    </div>
    <select class="guitar-pickup-select">
      <option>— Pickup —</option>
      <option selected>Bridge</option>
      <option>Middle</option>
      <option>Neck</option>
      <option>Bridge + Middle</option>
      <option>Neck + Middle</option>
    </select>
  </div>
  <div class="guitar-knobs" id="guitarKnobs"></div>
</div>

<!-- 5 Effect slots -->
<div class="slots-row" id="slotsRow"></div>

<!-- Effect editor -->
<div class="effect-editor" id="effectEditor">
  <div class="editor-header">
    <select class="editor-cat-select" id="editorCat" onchange="onCatChange()"></select>
    <select class="editor-effect-select" id="editorEffect" onchange="onEffectChange()"></select>
  </div>
  <div class="page-tabs" id="pageTabs"></div>
  <div class="knobs-grid" id="knobsGrid"></div>
</div>



<script>
const EFFECTS = {
  DYNAMICS: {
    'Comp':       [{n:'Sense',min:0,max:10},{n:'ATTCK',min:0,max:1,labels:['SLOW','FAST']},{n:'Tone',min:0,max:10},{n:'VOL',min:0,max:100}],
    'RackComp':   [{n:'THRSH',min:0,max:50},{n:'Ratio',min:1,max:10},{n:'ATTCK',min:1,max:10},{n:'VOL',min:0,max:100}],
    'SlowATTCK':  [{n:'Time',min:1,max:50},{n:'Curve',min:0,max:10},{n:'Tone',min:0,max:100},{n:'VOL',min:0,max:100}],
    'ZNR':        [{n:'DETCT',min:0,max:1,labels:['GTRIN','EFXIN']},{n:'Depth',min:0,max:100},{n:'THRSH',min:0,max:100},{n:'Decay',min:0,max:100}],
    'MuteSW':     [{n:'Edge',min:0,max:100},{n:'Speed',min:0,max:100},{n:'INVRT',min:0,max:1,labels:['NORMAL','INVERT']},{n:'ON/OFF',min:0,max:2,labels:['LATCH','UnLATCH','TRGGR']}],
    'GrayComp':   [{n:'SUSTN',min:0,max:100},{n:'Lo',min:0,max:100},{n:'Hi',min:0,max:100},{n:'VOL',min:0,max:100}],
    'NoiseGate':  [{n:'DETCT',min:0,max:1,labels:['GTRIN','EFXIN']},{n:'Depth',min:0,max:100},{n:'THRSH',min:0,max:100},{n:'Decay',min:0,max:100}],
    'OptComp':    [{n:'Drive',min:0,max:10},{n:'Lo',min:0,max:100},{n:'Hi',min:0,max:100},{n:'VOL',min:0,max:100}],
    'BlackOpt':   [{n:'Comp',min:0,max:100},{n:'Lo',min:0,max:100},{n:'Hi',min:0,max:100},{n:'VOL',min:0,max:100}],
    'LMT-76':     [{n:'Input',min:0,max:80},{n:'Ratio',min:0,max:3,labels:['4:1','8:1','12:1','20:1']},{n:'REL',min:10,max:70},{n:'Output',min:0,max:80}],
  },
  FILTER: {

const PAGE_SIZE = 4;
const patch = {
  slots: Array(6).fill(null).map(() => ({cat:null,effect:null,on:true,params:{},page:0})),
  activeSlot: null,
};
const guitarParams = [
  {n:'Vol',   min:0,max:10,val:8},
  {n:'Tone 1',min:0,max:10,val:7},
  {n:'Tone 2',min:0,max:10,val:6},
];

// ── Drag state ───────────────────────────────────────────────────────────
let dragSrcIndex = null;

// ── Build slots ──────────────────────────────────────────────────────────
function buildSlots() {
  const row = document.getElementById('slotsRow');
  row.innerHTML = '';

  const STOMP_SLOTS = [0,1,2,4,5];
  for (let _si = 0; _si < STOMP_SLOTS.length; _si++) { const i = STOMP_SLOTS[_si];
    const s = patch.slots[i];

    // Outer column (draggable)
    const col = document.createElement('div');
    col.className = 'slot-column';
    col.draggable = true;
    col.dataset.index = i;

    // Drag events
    col.addEventListener('dragstart', e => {
      dragSrcIndex = i;
      col.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    col.addEventListener('dragend', () => {
      col.classList.remove('dragging');
      document.querySelectorAll('.slot-column').forEach(c => c.classList.remove('drag-over'));
    });
    col.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.slot-column').forEach(c => c.classList.remove('drag-over'));
      if (dragSrcIndex !== i) col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      if (dragSrcIndex !== null && dragSrcIndex !== i) {
        // swap slots
        const tmp = patch.slots[dragSrcIndex];
        patch.slots[dragSrcIndex] = patch.slots[i];
        patch.slots[i] = tmp;
        // update activeSlot index
        if (patch.activeSlot === dragSrcIndex) patch.activeSlot = i;
        else if (patch.activeSlot === i) patch.activeSlot = dragSrcIndex;
        dragSrcIndex = null;
        buildSlots();
        renderEditor();
      }
    });

    // Effect card
    const slot = document.createElement('div');
    slot.className = 'effect-slot'
      + (s.cat ? ' bg-' + s.cat : ' empty')
      + (patch.activeSlot === i ? ' active' : '');
    slot.onclick = () => selectSlot(i);

    const num = document.createElement('div');
    num.className = 'slot-num';
    num.textContent = _si + 1;
    slot.appendChild(num);

    if (s.cat) {
      const cat = document.createElement('div');
      cat.className = 'slot-cat cat-' + s.cat;
      cat.textContent = s.cat;
      slot.appendChild(cat);

      const name = document.createElement('div');
      name.className = 'slot-name';
      name.textContent = s.effect;
      slot.appendChild(name);
    } else {
      const icon = document.createElement('div');
      icon.className = 'slot-empty-icon';
      icon.textContent = '＋';
      slot.appendChild(icon);
    }

    col.appendChild(slot);

    // Stomp button — only show if slot has an effect
    const stomp = document.createElement('button');
    stomp.className = 'stomp-btn ' + (s.on ? 'on' : 'off');
    stomp.title = s.on ? 'ON' : 'OFF (bypassed)';
    stomp.onclick = e => {
      e.stopPropagation();
      s.on = !s.on;
      stomp.className = 'stomp-btn ' + (s.on ? 'on' : 'off');
      stomp.title = s.on ? 'ON' : 'OFF (bypassed)';
      midiSendSlotOnOff(i, s.on);
    };
    // hide stomp on empty slots — show a dimmed placeholder
    if (!s.cat) {
      stomp.style.opacity = '0.2';
      stomp.style.pointerEvents = 'none';
    }
    col.appendChild(stomp);

    row.appendChild(col);
  }
}

function selectSlot(i) {
  patch.activeSlot = patch.activeSlot === i ? null : i;
  buildSlots();
  renderEditor();
}

// ── Editor ───────────────────────────────────────────────────────────────
function renderEditor() {
  const editor = document.getElementById('effectEditor');
  if (patch.activeSlot === null) { editor.classList.remove('open'); return; }
  editor.classList.add('open');
  const s = patch.slots[patch.activeSlot];

  const catSel = document.getElementById('editorCat');
  catSel.innerHTML = Object.keys(EFFECTS).map(c =>
    `<option value="${c}" ${s.cat===c?'selected':''}>${c}</option>`
  ).join('');
  if (!s.cat) { s.cat = Object.keys(EFFECTS)[0]; catSel.value = s.cat; }
  renderEffectSelect();
}

function renderEffectSelect() {
  const s = patch.slots[patch.activeSlot];
  const effSel = document.getElementById('editorEffect');
  const effects = Object.keys(EFFECTS[s.cat] || {});
  effSel.innerHTML = effects.map(e =>
    `<option value="${e}" ${s.effect===e?'selected':''}>${e}</option>`
  ).join('');
  if (!s.effect || !EFFECTS[s.cat][s.effect]) { s.effect = effects[0]; effSel.value = s.effect; }
  initDefaults();
  renderKnobs();
}

function initDefaults() {
  const s = patch.slots[patch.activeSlot];
  (EFFECTS[s.cat]?.[s.effect] || []).forEach(p => {
    if (s.params[p.n] === undefined)
      s.params[p.n] = p.labels ? 0 : Math.round((p.min + p.max) / 2);
  });
}

function onCatChange() {
  const s = patch.slots[patch.activeSlot];
  s.cat = document.getElementById('editorCat').value;
  s.effect = null; s.params = {}; s.page = 0;
  renderEffectSelect(); buildSlots();
}

function onEffectChange() {
  const s = patch.slots[patch.activeSlot];
  s.effect = document.getElementById('editorEffect').value;
  s.params = {}; s.page = 0;
  initDefaults(); renderKnobs(); buildSlots();
}

function renderKnobs() {
  const s = patch.slots[patch.activeSlot];
  const all = EFFECTS[s.cat]?.[s.effect] || [];

  document.getElementById('pageTabs').innerHTML = '';

  const grid = document.getElementById('knobsGrid');
  grid.innerHTML = '';

  all.forEach((p, i) => {
    const pageIndex = Math.floor(i / PAGE_SIZE);
    const val = s.params[p.n] ?? p.min;
    const slotIdx = patch.activeSlot;
    const paramIdx = i;
    const cb = v => {
      s.params[p.n] = v;
      midiSendParam(slotIdx, paramIdx, v);
    };
    let el;
    if (p.labels && p.labels.length === 2) {
      el = makeSwitch(p, val, cb);
    } else if (p.labels && p.labels.length > 2) {
      el = makePill(p, val, cb);
    } else {
      el = makeKnob(p, val, s.cat, cb);
    }
    if (pageIndex > 0) el.classList.add('param-alt-page');
    grid.appendChild(el);
  });
}

function setPage(pi) { patch.slots[patch.activeSlot].page = pi; renderKnobs(); }

// ── Guitar knobs ─────────────────────────────────────────────────────────
function buildGuitarKnobs() {
  const wrap = document.getElementById('guitarKnobs');
  wrap.innerHTML = '';
  guitarParams.forEach((p, i) => {
    wrap.appendChild(makeKnob(p, p.val, 'GUITAR', v => guitarParams[i].val = v));
  });
}

// ── Switch factory (2-option boolean params) ─────────────────────────────
function makeSwitch(param, initVal, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'switch-wrap';

  const label = document.createElement('div');
  label.className = 'switch-label';
  label.textContent = param.n;

  const track = document.createElement('div');
  track.className = 'switch-track' + (initVal ? ' on' : '');

  const thumb = document.createElement('div');
  thumb.className = 'switch-thumb';
  track.appendChild(thumb);

  const valDisplay = document.createElement('div');
  valDisplay.className = 'switch-value';
  valDisplay.textContent = param.labels[initVal ? 1 : 0];

  let cur = initVal ? 1 : 0;
  track.addEventListener('click', () => {
    cur = cur ? 0 : 1;
    track.classList.toggle('on', cur === 1);
    valDisplay.textContent = param.labels[cur];
    onChange?.(cur);
  });

  wrap.appendChild(label);
  wrap.appendChild(track);
  wrap.appendChild(valDisplay);
  return wrap;
}

// ── Pill selector factory (3+ option enum params) ────────────────────────
function makePill(param, initVal, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'pill-wrap';

  const label = document.createElement('div');
  label.className = 'pill-label';
  label.textContent = param.n;

  const opts = document.createElement('div');
  opts.className = 'pill-options';

  let cur = Math.round(Math.max(0, Math.min(param.labels.length - 1, initVal - param.min)));

  param.labels.forEach((lbl, i) => {
    const btn = document.createElement('button');
    btn.className = 'pill-opt' + (i === cur ? ' active' : '');
    btn.textContent = lbl;
    btn.addEventListener('click', () => {
      cur = i;
      opts.querySelectorAll('.pill-opt').forEach((b, j) => b.classList.toggle('active', j === i));
      onChange?.(param.min + i);
    });
    opts.appendChild(btn);
  });

  wrap.appendChild(label);
  wrap.appendChild(opts);
  return wrap;
}

// ── Knob factory ─────────────────────────────────────────────────────────
const MIN_ANG = -135, MAX_ANG = 135;
function valToAngle(val, min, max) {
  return MIN_ANG + ((val - min) / (max - min)) * (MAX_ANG - MIN_ANG);
}

function makeKnob(param, initVal, cat, onChange) {
  const SIZE = 44, CX = 22, CY = 22, R = 18;
  const wrap = document.createElement('div');
  wrap.className = 'knob-wrap';

  const label = document.createElement('div');
  label.className = 'knob-label';
  label.textContent = param.n;

  const knob = document.createElement('div');
  knob.className = 'knob';

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${SIZE} ${SIZE}`);
  svg.classList.add('knob-svg');

  function polar(a, r) {
    const rad = (a - 90) * Math.PI / 180;
    return {x: CX + r*Math.cos(rad), y: CY + r*Math.sin(rad)};
  }
  function arc(a1, a2) {
    const s = polar(a1,R), e = polar(a2,R);
    const large = Math.abs(a2-a1) > 180 ? 1 : 0;
    return `M ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${e.x.toFixed(2)} ${e.y.toFixed(2)}`;
  }

  const track = document.createElementNS('http://www.w3.org/2000/svg','path');
  track.setAttribute('d', arc(MIN_ANG, MAX_ANG));
  track.setAttribute('fill','none');
  track.setAttribute('stroke','#252525');
  track.setAttribute('stroke-width','2.5');
  track.setAttribute('stroke-linecap','round');

  const valArc = document.createElementNS('http://www.w3.org/2000/svg','path');
  valArc.setAttribute('fill','none');
  valArc.setAttribute('stroke-width','2.5');
  valArc.setAttribute('stroke-linecap','round');
  valArc.classList.add('arc-' + cat);

  svg.appendChild(track);
  svg.appendChild(valArc);

  const body = document.createElement('div');
  body.className = 'knob-body';
  const dot = document.createElement('div');
  dot.className = 'knob-indicator';
  body.appendChild(dot);
  knob.appendChild(svg);
  knob.appendChild(body);

  const valDisplay = document.createElement('div');
  valDisplay.className = 'knob-value';

  let cur = initVal;

  function update(val) {
    cur = Math.max(param.min, Math.min(param.max, val));
    const angle = valToAngle(cur, param.min, param.max);
    if (cur > param.min) {
      valArc.setAttribute('d', arc(MIN_ANG, angle));
      valArc.style.display = '';
    } else {
      valArc.style.display = 'none';
    }
    const bodyR = (SIZE/2 - 6) - 4;
    const rad = (angle - 90) * Math.PI / 180;
    dot.style.left = (CX + bodyR * Math.cos(rad) - 1.5) + 'px';
    dot.style.top  = (CY + bodyR * Math.sin(rad) - 1.5) + 'px';
    valDisplay.textContent = fmtVal(cur, param);
    onChange?.(cur);
  }

  update(initVal);

  let startY, startVal;
  const range = param.max - param.min;

  function onMove(cy) {
    update(Math.round(startVal + ((startY - cy) / 160) * range));
  }
  knob.addEventListener('mousedown', e => {
    startY = e.clientY; startVal = cur; e.preventDefault();
    const mm = e2 => onMove(e2.clientY);
    const mu = () => { document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); };
    document.addEventListener('mousemove',mm);
    document.addEventListener('mouseup',mu);
  });
  knob.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY; startVal = cur; e.preventDefault();
  }, {passive:false});
  knob.addEventListener('touchmove', e => {
    onMove(e.touches[0].clientY); e.preventDefault();
  }, {passive:false});

  wrap.appendChild(label);
  wrap.appendChild(knob);
  wrap.appendChild(valDisplay);
  return wrap;
}

function fmtVal(val, param) {
  if (param.labels) return param.labels[Math.min(Math.round(val), param.labels.length-1)] ?? val;
  return val;
}

// ── PTCF Effect ID map (empirically discovered from G1X Four MIDI) ───────
const PTCF_ID_MAP = {
  0x01: 'FD DLXR',
  0x20: 'MonoPitch',
  0x28: 'FD B-MAN',
  0x2D: 'TapeEcho',
  0x30: 'FD-DX1x12',
  // Add more as confirmed through testing
};

// ── Parse a PTCF binary (array of bytes) into slot assignments ───────────
function parsePTCF(bytes) {
  // Find PTCF magic
  let ptcfStart = -1;
  for (let i = 0; i < bytes.length - 3; i++) {
    if (bytes[i]===0x50 && bytes[i+1]===0x54 && bytes[i+2]===0x43 && bytes[i+3]===0x46) {
      ptcfStart = i; break;
    }
  }
  if (ptcfStart < 0) return null;
  const ptcf = bytes.slice(ptcfStart);

  // Name field: FIXED 10 bytes at ptcf[29:39], filter nulls
  const nameBytes = ptcf.slice(29, 39).filter(b => b > 31 && b < 127);
  const patchName = nameBytes.map(b => String.fromCharCode(b)).join('').trim();

  // Find '"' (0x22) separator
  let sepPos = -1;
  for (let i = 28; i < Math.min(65, ptcf.length); i++) {
    if (ptcf[i] === 0x22) { sepPos = i; break; }
  }
  if (sepPos < 0) return null;

  // After sep: [label 2 bytes] [00] [00] [06=numslots] [flags 4 bytes] [entries...]
  // Format confirmed: [slot_1based][effectId][00][00] per active slot
  const entriesStart = sepPos + 10;

  // Stop at TXJ chunk
  let txjPos = ptcf.length;
  for (let i = entriesStart; i < ptcf.length - 2; i++) {
    if (ptcf[i]===0x54 && ptcf[i+1]===0x58 && ptcf[i+2]===0x4A) { txjPos = i; break; }
  }

  // Scan for [slot_1based 1-6][effectId nonzero][00][00]
  const slots = [];
  const seen = new Set();
  for (let i = entriesStart; i + 3 < txjPos; i++) {
    const slot1 = ptcf[i];
    const eid   = ptcf[i+1];
    const p2    = ptcf[i+2];
    const p3    = ptcf[i+3];
    if (slot1 >= 1 && slot1 <= 6 && eid !== 0x00 && p2 === 0x00 && p3 === 0x00 && !seen.has(slot1)) {
      const slotApp = slot1 - 1; // 1-based → 0-based
      const effectName = PTCF_ID_MAP[eid] || null;
      const cat = effectName ? effectNameToCat(effectName) : null;
      slots.push({ slot: slotApp, effectId: eid, effectName, cat });
      seen.add(slot1);
      i += 3; // skip the matched entry
    }
  }

  return { patchName, slots };
}

// Apply parsed PTCF to the patch UI
function applyPTCF(bytes) {
  const result = parsePTCF(bytes);
  if (!result) return;

  const { patchName, slots } = result;

  if (patchName) {
    const nameInput = document.getElementById('patchName');
    if (nameInput) nameInput.value = patchName;
  }

  // Clear slots (keep 5 slots, 0-4)
  patch.slots = Array(6).fill(null).map(() => ({cat:null,effect:null,on:true,params:{},page:0}));

  for (const { slot, effectId, effectName, cat } of slots) {
    if (slot < 0 || slot > 5) continue;
    if (effectName && cat) {
      patch.slots[slot] = { cat, effect: effectName, on: true, params: {}, page: 0 };
      const paramDefs = EFFECTS[cat]?.[effectName] || [];
      paramDefs.forEach(p => {
        patch.slots[slot].params[p.n] = p.labels ? 0 : Math.round((p.min + p.max) / 2);
      });
    } else {
      patch.slots[slot] = {
        cat: null,
        effect: `?? 0x${effectId.toString(16).toUpperCase().padStart(2,'0')}`,
        on: true, params: {}, page: 0, _unknownId: effectId
      };
    }
  }

  patch.activeSlot = null;
  buildSlots();
  renderEditor();

  const unknowns = slots.filter(s => !s.effectName);
  if (unknowns.length > 0) {
    const ids = unknowns.map(s => `0x${s.effectId.toString(16).toUpperCase().padStart(2,'0')}`).join(', ');
    setMidiStatus('connected', `${midiOut?.name} — unknown: ${ids}`);
    setTimeout(() => setMidiStatus('connected', midiOut?.name), 6000);
  }
}

// ── Find which category an effect belongs to ─────────────────────────────
function effectNameToCat(name) {
  for (const [cat, effects] of Object.entries(EFFECTS)) {
    if (effects[name]) return cat;
  }
  return null;
}

// ── MIDI Engine ───────────────────────────────────────────────────────────
const ZOOM = [0x52, 0x00, 0x6e];
let midiOut = null, midiIn = null, midiAccess = null;
let editorMode = false;
let midiBank = 0, midiProg = 0;

function sysex(...bytes) { return [0xF0, ...ZOOM, ...bytes, 0xF7]; }

function midiSend(bytes) {
  if (!midiOut) return;
  try { midiOut.send(bytes); } catch(e) { console.warn('MIDI send error', e); }
}

// Encode value to 7-bit little-endian (2 bytes) for SysEx
function encode7bit(val) {
  if (val < 0) val = val + 16384; // handle negatives
  return [val & 0x7F, (val >> 7) & 0x7F];
}

async function connectMIDI() {
  setMidiStatus('searching', 'Connecting…');
  try {
    midiAccess = await navigator.requestMIDIAccess({ sysex: true });
  } catch(e) {
    setMidiStatus('error', 'Permission denied');
    return;
  }

  // Find Zoom device
  for (const out of midiAccess.outputs.values()) {
    if (out.name.toLowerCase().includes('zoom') || out.name.toLowerCase().includes('g1')) {
      midiOut = out; break;
    }
  }
  if (!midiOut) midiOut = midiAccess.outputs.values().next().value;

  for (const inp of midiAccess.inputs.values()) {
    if (inp.name.toLowerCase().includes('zoom') || inp.name.toLowerCase().includes('g1')) {
      midiIn = inp; break;
    }
  }
  if (!midiIn) midiIn = midiAccess.inputs.values().next().value;
  if (midiIn) midiIn.onmidimessage = onMidiMessage;

  if (midiOut) {
    setMidiStatus('connected', midiOut.name);
    document.getElementById('midiConnectBtn').className = 'midi-connect-btn connected';
    document.getElementById('midiConnectBtn').textContent = 'Connected';
    document.getElementById('midiBpRow').style.display = 'flex';
    buildBankProg();
    enterEditorMode();
    setTimeout(requestPatch, 300);
  } else {
    setMidiStatus('error', 'No device found');
  }

  midiAccess.onstatechange = e => {
    if (e.port.state === 'disconnected' && e.port === midiOut) {
      setMidiStatus('error', 'Disconnected');
      document.getElementById('midiConnectBtn').className = 'midi-connect-btn';
      document.getElementById('midiConnectBtn').textContent = 'Connect';
      document.getElementById('midiBpRow').style.display = 'none';
      midiOut = null; editorMode = false;
    }
  };
}

function onMidiMessage(e) {
  const d = Array.from(e.data);
  if (d[0] !== 0xF0 || d[1] !== 0x52 || d[2] !== 0x00 || d[3] !== 0x6E) return;
  const cmd = d[4];

  // PTCF dump from pedal (auto on effect change, or response to our 0x64 0x13 request)
  if ((cmd === 0x64 && d[5] === 0x12) || cmd === 0x45) {
    applyPTCF(d);
    return;
  }

  // Editor mode param update: F0 52 00 6E 64 03 00 [slot] [param] [lo] [hi] ...
  if (cmd === 0x64 && d[5] === 0x03 && d[6] === 0x00) {
    const slot  = d[7];
    const param = d[8];
    const lo    = d[9]  ?? 0;
    const hi    = d[10] ?? 0;
    let val = lo | (hi << 7);
    if (val >= 8192) val -= 16384;
    if (slot < 0 || slot > 5) return;

    if (param === 0) {
      patch.slots[slot].on = val === 1;
      buildSlots();
    } else if (param >= 2) {
      const dialIndex = param - 2;
      const s = patch.slots[slot];
      if (s.cat && s.effect && EFFECTS[s.cat]?.[s.effect]) {
        const paramDef = EFFECTS[s.cat][s.effect][dialIndex];
        if (paramDef) {
          s.params[paramDef.n] = val;
          if (patch.activeSlot === slot) renderKnobs();
        }
      } else {
        if (!s._rawParams) s._rawParams = {};
        s._rawParams[dialIndex] = val;
      }
    }
    flashSlot(slot);
  }
}

// Flash a slot card briefly to indicate incoming MIDI
function flashSlot(slotIndex) {
  const STOMP_SLOTS = [0,1,2,4,5];
  const visIdx = STOMP_SLOTS.indexOf(slotIndex);
  if (visIdx < 0) return;
  const cols = document.querySelectorAll('.slot-column');
  if (cols[visIdx]) {
    cols[visIdx].classList.add('midi-flash');
    setTimeout(() => cols[visIdx].classList.remove('midi-flash'), 300);
  }
}

// Request current patch state from pedal
function requestPatch() {
  if (!midiOut) return;
  midiSend(sysex(0x64, 0x13));
}

// Clear patch UI and request fresh state from pedal
function clearPatchUI() {
  patch.slots = Array(6).fill(null).map(() => ({cat:null,effect:null,on:true,params:{},page:0}));
  patch.activeSlot = null;
  buildSlots();
  renderEditor();
  // Small delay to let the bank/prog switch settle, then request patch
  setTimeout(requestPatch, 200);
}

function setMidiStatus(state, text) {
  document.getElementById('midiDot').className = 'midi-dot ' + state;
  document.getElementById('midiStatus').textContent = text;
}

function enterEditorMode() {
  midiSend(sysex(0x50));
  editorMode = true;
  document.getElementById('midiEditorBtn').classList.add('active');
  document.getElementById('midiEditorBtn').textContent = 'Editing';
}

function exitEditorMode() {
  midiSend(sysex(0x51));
  editorMode = false;
  document.getElementById('midiEditorBtn').classList.remove('active');
  document.getElementById('midiEditorBtn').textContent = 'Edit';
}

function toggleEditorMode() {
  editorMode ? exitEditorMode() : enterEditorMode();
}

function buildBankProg() {
  const bankNames = ['A','B','C','D','E'];
  const bb = document.getElementById('midiBankBtns');
  bb.innerHTML = '';
  bankNames.forEach((name, i) => {
    const btn = document.createElement('button');
    btn.className = 'midi-bank-btn' + (i === midiBank ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => { midiBank = i; buildBankProg(); sendBankProg(); updatePatchSlotLabel(); clearPatchUI(); };
    bb.appendChild(btn);
  });

  const pb = document.getElementById('midiProgBtns');
  pb.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'midi-prog-btn' + (i === midiProg ? ' active' : '');
    btn.textContent = i;
    btn.onclick = () => { midiProg = i; buildBankProg(); sendBankProg(); updatePatchSlotLabel(); clearPatchUI(); };
    pb.appendChild(btn);
  }
}

function sendBankProg() {
  midiSend([0xb0, 0x20, midiBank]);
  midiSend([0xc0, midiProg]);
}

function updatePatchSlotLabel() {
  const bankName = ['A','B','C','D','E'][midiBank];
  document.getElementById('patchSlotLabel').textContent = bankName + '-' + midiProg;
}

// ── Send slot on/off to pedal ─────────────────────────────────────────────
function midiSendSlotOnOff(slotIndex, on) {
  if (!midiOut || !editorMode) return;
  midiSend(sysex(0x64, 0x03, 0x00, slotIndex, 0x00, on ? 0x01 : 0x00, 0x00, 0x00, 0x00, 0x00));
}

// ── Send param change to pedal ────────────────────────────────────────────
function midiSendParam(slotIndex, paramIndex, value) {
  if (!midiOut || !editorMode) return;
  // param index offset by 2 (0=on/off, 1=effect type, 2+=dials)
  const midiParamIndex = paramIndex + 2;
  const encoded = encode7bit(value);
  midiSend(sysex(0x64, 0x03, 0x00, slotIndex, midiParamIndex, encoded[0], encoded[1], 0x00, 0x00, 0x00));
}

// ── Init ─────────────────────────────────────────────────────────────────
document.getElementById('patchLevel').addEventListener('input', function() {
  document.getElementById('patchLevelVal').textContent = this.value;
});

buildSlots();
buildGuitarKnobs();
</script>
